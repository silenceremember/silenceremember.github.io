<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#d90429" />
    <meta name="color-scheme" content="dark" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://silenceremember.github.io/" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />

    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Страница не найдена | Максим Ельчанинов" />
    <meta property="og:description" content="Такой страницы нет. Вернитесь на главную." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Максим Ельчанинов, гейм-дизайн и интерфейсы" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Максим Ельчанинов" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://silenceremember.github.io/" />
    <meta name="twitter:title" content="Страница не найдена | Максим Ельчанинов" />

    <!-- critical-css: вставляет vite-plugin-site-shell из src/partials/critical.css -->

    <!-- Google Fonts - Inter (optimized for performance) -->
    <!-- Resource Hints: DNS prefetch для внешних ресурсов -->
    
    <!-- Google Fonts будут автоматически инлайнены через vite-plugin-webfont-dl -->
    <!-- Это устраняет внешние запросы и улучшает LCP -->

    <!-- Resource Hints: Preload критических ресурсов -->
    <link rel="preload" href="/scss/style.scss" as="style" />
    <!-- Preload критических JSON данных -->
    <link rel="preload" href="/data/locales/ru.json" as="fetch" crossorigin />
    <!-- Preload критических HTML шаблонов -->
    <!-- Prefetch для SVG иконок (загружаются асинхронно через SvgLoader) -->
    <link rel="prefetch" href="/assets/images/icon-divider-medium.svg" as="image" />
    <link rel="prefetch" href="/assets/images/icon-moon.svg" as="image" />
    <link rel="prefetch" href="/assets/images/icon-sun.svg" as="image" />
    <link rel="prefetch" href="/assets/images/icon-linkedin.svg" as="image" />
    <link rel="prefetch" href="/assets/images/icon-headhunter.svg" as="image" />
    <link rel="prefetch" href="/assets/images/icon-telegram.svg" as="image" />
    <link rel="prefetch" href="/assets/images/logo-icon.svg" as="image" />
    <!-- Modulepreload для критических JS модулей (загружает и парсит модуль) -->
    <!-- Vite автоматически добавит правильные modulepreload ссылки при сборке -->

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Maxim Elchaninov" />
    <link rel="manifest" href="/favicon/site.webmanifest" />


    <!-- Theme switcher script - загружается синхронно для предотвращения мерцания -->
    <script src="/js/components/ThemeInit.js"></script>
    
    <!-- Google Analytics -->
    <script src="/js/analytics.js"></script>

    <!-- Main CSS -->
    <link rel="stylesheet" href="/scss/style.scss" />
  </head>
  <body class="page-404">
    <div class="page-wrapper">
      <!-- Background Effect -->
      <div id="background-container"></div>

      <!-- Header -->
      <header class="header"></header>

      <!-- Horizontal decorative line -->
      <div class="decorative-line-horizontal"></div>

      <!-- Main Content -->
      <main class="content-wrapper">
        <div class="container page-404-container">
          <!-- Контейнер для индикатора загрузки -->
          <div
            class="notfound-loading-container"
            id="notfound-loading-container"
          >
            <!-- Индикатор загрузки -->
            <div class="loading" id="notfound-loading">
              <div class="loading-squares">
                <div class="loading-square"></div>
                <div class="loading-square"></div>
                <div class="loading-square"></div>
              </div>
            </div>
          </div>

          <div class="cta-slide-content page-404-content">
            <div>
              <h1 class="main-content-name" data-i18n="404.heading">404</h1>
              <p class="main-content-title" data-i18n="404.subtitle">
                СТРАНИЦА НЕ НАЙДЕНА
              </p>
            </div>
            <p class="main-content-description" data-i18n="404.message">
              The page may have been moved or deleted
            </p>
            <div class="cta-buttons">
              <a href="/" class="cta-button cta-button-primary"><span class="i18n-ru">На главную</span><span class="i18n-en" lang="en">Home</span></a>
            </div>
          </div>
        </div>
      </main>

      <!-- Horizontal decorative line -->
      <div class="decorative-line-horizontal"></div>

      <!-- Footer -->
      <footer class="footer"></footer>
    </div>

    <div class="custom-cursor"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
