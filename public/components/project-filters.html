<div class="project-filters">
  <div class="project-filters-content">
    <!-- Фильтр по категории -->
    <div class="project-filters-group">
      <p class="project-filters-group-title">Категория</p>
      <div class="project-filters-options" data-filter="category">
        <button
          class="project-filters-option"
          data-value="ux"
          aria-pressed="false"
        >
          <span class="project-filters-option-label" data-i18n="projects.filters.categories.ux">Интерфейсы</span>
          <span class="project-filters-option-count">0</span>
        </button>
        <button
          class="project-filters-option"
          data-value="games"
          aria-pressed="false"
        >
          <span class="project-filters-option-label">Игровые проекты</span>
          <span class="project-filters-option-count">0</span>
        </button>
        <button
          class="project-filters-option"
          data-value="tools"
          aria-pressed="false"
        >
          <span class="project-filters-option-label">Инструменты</span>
          <span class="project-filters-option-count">0</span>
        </button>
        <button
          class="project-filters-option"
          data-value="research"
          aria-pressed="false"
        >
          <span class="project-filters-option-label">Исследования</span>
          <span class="project-filters-option-count">0</span>
        </button>
      </div>
    </div>
  </div>

</div>
